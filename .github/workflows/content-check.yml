name: Content checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Verify baseline and current editorial decisions
        run: python3 tools/check.py
      - name: Verify validation safeguards
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Require complete copy when ready for review
        if: hashFiles('content/home/READY_FOR_REVIEW') != ''
        run: python3 tools/check.py --complete
      - name: Verify implementation handoff consistency
        if: hashFiles('content/home/apply-plan.json') != ''
        run: python3 tools/verify_home_handoff.py
      - name: Verify controlled Webflow rate policy
        run: node tools/test_webflow_rate_policy.cjs
      - name: Verify saved implementation evidence
        if: hashFiles('implementation/2026-10-13-enterprise-orchestration/report.json') != ''
        run: python3 tools/verify_home_implementation.py
      - name: Verify ordinal formatting safeguards
        run: node tools/test_home_ordinal_format.cjs
      - name: Verify ordinal animation implementation evidence
        if: hashFiles('implementation/2026-10-13-ordinal-animation/application.json') != ''
        run: python3 tools/verify_home_ordinal_implementation.py
      - name: Verify original-project transfer evidence
        if: hashFiles('implementation/2026-10-13-production-home-transfer/after-all-trees.json') != ''
        run: python3 tools/verify_production_transfer.py
