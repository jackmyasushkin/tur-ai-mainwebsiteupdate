name: Prepare approved Home handoff once

on:
  push:
    branches: [content/home-operational-plane-2026-10-13]
    paths: [tools/prepare_home_handoff.py]

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'jackmyasushkin/tur-ai-mainwebsiteupdate' && github.ref == 'refs/heads/content/home-operational-plane-2026-10-13'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Prepare exact copy, handoff and run full tests
        run: python3 tools/prepare_home_handoff.py
      - name: Commit prepared files to the existing content branch only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- baseline/
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          rm .github/workflows/prepare-home-handoff.yml tools/prepare_home_handoff.py
          rm -r tools/handoff_v2
          git add -A -- content/home docs tools README.md AGENTS.md .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize approved enterprise orchestration Home and implementation handoff'
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "PREPARED_COMMIT_SHA=$(git rev-parse HEAD)"
      - name: Verify committed handoff
        run: |
          python3 tools/check.py --complete
          python3 tools/verify_home_handoff.py
